# TypeScript SDK snapshot patch for foreground and background KH SDK failures.

- id: skill-filesystem
  name: '@kinetick-labs/kh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@kinetick-labs/kh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@kinetick-labs/kh-session-persistence-jsonl'
  config:
    root: !!js khHomePath('sessions')
    compression: !!js "process.env.KH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- insert:
    - id: subagent-kh-sdk-diagnostic
      name: '@kinetick-labs/kh-subagent-kh-sdk'
      config:
        providerName: kh-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.KH_TEST_CHILD_PATCH
        khHome: !!js khHomePath('children/foreground')
        provider: mock
        model: mock-echo
        env:
          KH_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-kh-sdk-diagnostic
      name: '@kinetick-labs/kh-tool-subagent'
      config:
        provider: kh-sdk-diagnostic
        toolName: subagent_dsh_sdk
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: subagent-kh-sdk-diagnostic-background
      name: '@kinetick-labs/kh-subagent-kh-sdk'
      config:
        providerName: kh-sdk-diagnostic-background
        profile: sdk
        patches:
          - !!js process.env.KH_TEST_CHILD_PATCH
        khHome: !!js khHomePath('children/background')
        provider: mock
        model: mock-echo
        env:
          KH_TEST_CHILD_FAILURE: '1'
          FAKE_INIT_GO: .kh-sdk-background-release
    - id: tool-subagent-kh-sdk-diagnostic-background
      name: '@kinetick-labs/kh-tool-subagent'
      config:
        provider: kh-sdk-diagnostic-background
        toolName: subagent_dsh_sdk_background
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: release-kh-sdk-background-on-job-output
      name: '../../../apps/cli/tests/profiles/sdk/fixtures/subagent-kh-sdk-release-on-job-output.ts'
