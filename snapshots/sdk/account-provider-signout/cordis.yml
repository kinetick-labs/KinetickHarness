# TypeScript SDK snapshot-record patch over `kh --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@kinetick-labs/kh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek-account
  name: '@kinetick-labs/kh-llm-deepseek-account'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@kinetick-labs/kh-session-persistence-jsonl'
  config:
    root: !!js khHomePath('sessions')
    compression: !!js "process.env.KH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@kinetick-labs/kh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- insert:
    - id: account-signout-fixture
      name: './account-signout.mjs'

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
