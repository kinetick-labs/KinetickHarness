- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@kinetick-labs/kh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 8192
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high

- insert:
    - id: office-skills
      name: '@kinetick-labs/kh-skill-office'
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        cli: false

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: web-search-deepseek
  disabled: false
