# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: llm-deepseek
  name: '@kinetick-labs/kh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: lsp
      name: '@kinetick-labs/kh-lsp'
    - id: lsp-stdio
      name: '@kinetick-labs/kh-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@kinetick-labs/kh-tool-lsp'
      config:
        maxLocations: 1
    - id: llm-replay
      name: '@kinetick-labs/kh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: timeout-policy
  name: '@kinetick-labs/kh-tool-call-timeout-policy'

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
