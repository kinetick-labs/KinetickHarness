# Filesystem-scenario overlay: the sandboxed filesystem stack already lives in
# `kh-base`, so this patch changes only the local tool-result spill
# storage those scenarios exercise.

- id: spill-local
  name: '@kinetick-labs/kh-spill-local'
  config:
    root: !!js process.env.KH_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@kinetick-labs/kh-spill-policy'
  config:
    maxInlineTokens: !!js process.env.KH_SNAPSHOT && 200 || 12500

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.KH_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.KH_SNAPSHOT_SPILL_LOCATOR_ROOT

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
