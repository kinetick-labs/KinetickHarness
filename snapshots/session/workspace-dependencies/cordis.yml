- insert:
    - id: workspace-dependencies
      name: '@kinetick-labs/kh-tool-workspace-dependencies'
      config:
        source: !!js process.cwd() + '/runtime-source'
        root: !!js process.cwd() + '/runtime-installed'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
