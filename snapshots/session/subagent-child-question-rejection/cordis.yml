# Snapshot-only human-interaction composition. The provider is a tripwire: the
# runtime-owned child must be rejected by the seam before any UI wait begins.
- insert:
    - id: tool-ask-user
      name: '@kinetick-labs/kh-tool-ask-user'
    - id: child-question-tripwire
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/child-question-tripwire.ts'

- id: user-questions
  name: '@kinetick-labs/kh-user-questions'

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
