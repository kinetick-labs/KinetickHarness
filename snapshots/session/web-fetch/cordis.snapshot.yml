# Keyless replay counterpart: deterministic HTTP remains real; only the model
# adapter is replaced by replay.
- id: llm-deepseek
  name: '@kinetick-labs/kh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@kinetick-labs/kh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: web-fetch-fixture
      name: './web-fetch-fixture-server.mjs'

- id: web
  name: '@kinetick-labs/kh-web'

- id: web-fetch-http
  name: '@kinetick-labs/kh-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@kinetick-labs/kh-tool-web'
  config:
    search: false

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
