# The test-only driver changes the selection captured for the second step so
# installModelSelection emits its durable notice before the changed request.
- insert:
    - id: model-switch-driver
      name: './model-switch-driver.mjs'

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
