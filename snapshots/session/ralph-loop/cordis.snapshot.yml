# Keyless replay for the `ralph` composition. The shared replay patch in
# `text-turn/cordis.snapshot.yml` applies only to the `default` composition, so
# a sibling composition restates those swaps and adds its own rows.
- id: llm-deepseek
  name: '@kinetick-labs/kh-llm-deepseek-api-key'
  disabled: true
- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@kinetick-labs/kh-session-persistence-jsonl'
  config:
    root: !!js khHomePath('sessions')
    compression: none

- id: sandbox
  name: '@kinetick-labs/kh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@kinetick-labs/kh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: tool-ralph
  disabled: false

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
