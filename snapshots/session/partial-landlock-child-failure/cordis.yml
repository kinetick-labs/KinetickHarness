# Live counterpart for the runner-classification snapshot overlay. It replaces
# only the sandbox provider; authored scenarios are skipped in record mode.
- id: sandbox
  name: '@kinetick-labs/kh-sandbox-local'
  disabled: true

- insert:
    - id: partial-landlock-sandbox
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/partial-landlock-sandbox.ts'

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
