# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@kinetick-labs/kh-llm-deepseek-api-key'
  disabled: true
- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@kinetick-labs/kh-session-persistence-jsonl'
  config:
    root: !!js khHomePath('sessions')
    compression: none

- id: sandbox
  name: '@kinetick-labs/kh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@kinetick-labs/kh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

# Restrict inherited capabilities before the child assembles its first request.
- id: tool-subagent
  name: '@kinetick-labs/kh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1
    toolFilter:
      deny: [write, edit, glob, grep, web_search, web_fetch]

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
