# The summary output cap inherits the 1,800-token headroom. A 1,000-token
# request output reservation lowers the proactive trigger to 5,582 tokens.

- id: llm-deepseek
  name: '@kinetick-labs/kh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@kinetick-labs/kh-session-persistence-jsonl'
  config:
    root: !!js khHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@kinetick-labs/kh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20

- insert:
    - id: llm-replay
      name: '@kinetick-labs/kh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8382
                defaultMaxTokens: 1000
