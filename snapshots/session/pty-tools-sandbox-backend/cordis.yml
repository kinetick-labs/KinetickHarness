# Opt-in persistent PTY composition for the PTY snapshot scenario. The base
# deployment already owns the shared sandbox provider and policy.
- insert:
    - id: pty
      name: '@kinetick-labs/kh-terminal'
    - id: terminal-bash
      name: '@kinetick-labs/kh-terminal-bash'
      config:
        pollIntervalMs: 10
        exactProbeAfterMs: 20
        idleSilenceMs: 250
        handoffGraceMs: 250
        timeoutMs: 2000
        disposeGraceMs: 500
    - id: tool-terminal
      name: '@kinetick-labs/kh-tool-terminal'

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
