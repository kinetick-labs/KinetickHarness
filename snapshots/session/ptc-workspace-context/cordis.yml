# PTC mode agent-instructions snapshot recording overlay. The default filesystem
# tools trigger nested instruction discovery after a read.
- insert:
    - id: literal-sdk
      name: '../../../packages/core/tools/tests/fixtures/literal-sdk.ts'

- id: agent-default-model
  name: '@kinetick-labs/kh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@kinetick-labs/kh-session-persistence-jsonl'
  config:
    root: !!js khHomePath('sessions')
    compression: !!js 'process.env.KH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@kinetick-labs/kh-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@kinetick-labs/kh-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@kinetick-labs/kh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.
