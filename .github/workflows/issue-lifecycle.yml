name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - closed
      - reopened
      - typed
      - untyped
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    if: >-
      (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Detect issue app credentials
        id: issue-app
        env:
          CLIENT_ID: ${{ vars.KH_ISSUE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.KH_ISSUE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::KH_ISSUE_APP_CLIENT_ID or KH_ISSUE_APP_PRIVATE_KEY is unset; skipping issue lifecycle."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create project token
        id: app-token
        if: ${{ steps.issue-app.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.KH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KH_ISSUE_APP_PRIVATE_KEY }}
          owner: kinetick-labs
          repositories: kinetick-harness
      - name: Handle repository event
        if: ${{ steps.issue-app.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle
