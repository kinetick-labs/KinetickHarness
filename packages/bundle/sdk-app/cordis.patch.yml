# The SDK application over kh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@kinetick-labs/kh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@kinetick-labs/kh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.KH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.KH_MAX_TOKENS_AS_SUCCESS)"

- id: hmr
  disabled: true

# The packaged carrier supplies a default; KH_PRIMARY_RUNTIME overrides it,
# including an empty-string opt-out. Each row can be patched independently.
- insert:
    - id: workspace-dependencies
      name: '@kinetick-labs/kh-tool-workspace-dependencies'
      disabled: !!js "!(process.env.KH_PRIMARY_RUNTIME ?? process.env.KH_BUNDLED_PRIMARY_RUNTIME)"
      config:
        source: !!js "process.getBuiltinModule('node:path').resolve(process.env.KH_PRIMARY_RUNTIME ?? process.env.KH_BUNDLED_PRIMARY_RUNTIME ?? '')"

    - id: skill-office
      name: '@kinetick-labs/kh-skill-office'
      disabled: !!js "!(process.env.KH_PRIMARY_RUNTIME ?? process.env.KH_BUNDLED_PRIMARY_RUNTIME)"
      config:
        assetRoot: !!js "process.getBuiltinModule('node:path').resolve(process.env.KH_PRIMARY_RUNTIME ?? process.env.KH_BUNDLED_PRIMARY_RUNTIME ?? '', '..', 'office-skills')"
        node: !!js "process.getBuiltinModule('node:path').resolve(process.env.KH_PRIMARY_RUNTIME ?? process.env.KH_BUNDLED_PRIMARY_RUNTIME ?? '', 'dependencies', 'node', 'bin', process.platform === 'win32' ? 'node.exe' : 'node')"
