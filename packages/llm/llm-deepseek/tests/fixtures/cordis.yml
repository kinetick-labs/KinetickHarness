- name: '@kinetick-labs/kh-llm'
- name: '@kinetick-labs/kh-session'
- name: '@kinetick-labs/kh-session-projection'
- name: '@kinetick-labs/kh-system-prompt'
- name: '@kinetick-labs/kh-tools'
- name: '@kinetick-labs/kh-agent'
- name: '@kinetick-labs/kh-agent-loop'
  config:
    agents: []
- name: '@kinetick-labs/kh-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@kinetick-labs/kh-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@kinetick-labs/kh-llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
