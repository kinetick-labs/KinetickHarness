# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@kinetick-labs/kh-system-prompt'

- id: tools
  name: '@kinetick-labs/kh-tools'

- id: subprocess
  name: '@kinetick-labs/kh-subprocess-local'

- id: bash
  name: '@kinetick-labs/kh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@kinetick-labs/kh-shell-env'

- id: tasks
  name: '@kinetick-labs/kh-jobs-local'

- id: tool-jobs
  name: '@kinetick-labs/kh-tool-jobs'

- id: tool-pwsh
  name: '@kinetick-labs/kh-tool-pwsh'
