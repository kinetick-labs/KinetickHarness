- insert:
    - id: mcp-pagination-limit
      name: '@kinetick-labs/kh-mcp-client'
      config:
        transport: stdio
        serverName: pagination-limit
        command: !!js process.execPath
        args: !!js '[process.env.KH_MCP_PAGINATION_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false
