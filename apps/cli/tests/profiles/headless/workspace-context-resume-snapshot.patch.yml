# Patch for resuming one seeded workspace-instruction session over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-instructions
  config:
    maxBytes: 65536
    khHome: !!js process.cwd() + '/.kh'

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: replay
      name: '@kinetick-labs/kh-llm-replay'
      config:
        file: !!js process.env.KH_SNAPSHOT_FILE
        overrideFile: !!js process.env.KH_SNAPSHOT_OVERRIDE

    # Publish the persisted agent before the driver selects the single root.
    - id: resumed-agent
      name: './tests/fixtures/workspace-context-resume-agent.ts'
